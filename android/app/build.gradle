/* APL TV for Android TV (and Fire TV, Google TV, Android boxes).
   The app itself is the same web app as on Samsung and LG (../../app), copied into the assets by
   tools/make-android.py, which then runs this build. Version: app/config.xml (passed as -PaplVersion). */
plugins {
    id "com.android.application"
}

def aplVersion = project.findProperty("aplVersion") ?: "1.0.0"
def parts = aplVersion.tokenize(".").collect { it as int } + [0, 0, 0]

android {
    namespace "com.knikt.apltv"
    compileSdk 35

    defaultConfig {
        applicationId "com.knikt.apltv"
        minSdk 21
        targetSdk 35
        versionCode parts[0] * 10000 + parts[1] * 100 + parts[2]
        versionName aplVersion
    }

    signingConfigs {
        release {
            // tools/make-android.py passes the keystore (kept outside the repository, never published);
            // its password only through the environment, never on a command line or in a log
            if (project.hasProperty("aplKeystore")) {
                storeFile file(project.property("aplKeystore"))
                storePassword System.getenv("APL_KEYSTORE_PASS")
                keyAlias project.property("aplKeyAlias")
                keyPassword System.getenv("APL_KEYSTORE_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Development builds (make-android.py --dev): the page can be inspected from the PC
            debuggable project.hasProperty("aplDebuggable")
            if (project.hasProperty("aplKeystore")) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Media3's "unstable" API warnings must not stop a release build
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        resources { excludes += ["META-INF/*.version", "META-INF/*.kotlin_module"] }
    }
}

dependencies {
    def media3 = "1.5.1"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-exoplayer-dash:$media3"
    implementation "androidx.media3:media3-ui:$media3"
}
