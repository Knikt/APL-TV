name: Bug report
description: Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report it!
        **Never paste your playlist link, your Xtream server, username or password here.**
  - type: dropdown
    id: tv
    attributes:
      label: Your TV
      options:
        - Samsung (Tizen)
        - LG (webOS)
        - Android TV / Google TV / Fire TV
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and system version
      placeholder: "Samsung QE55Q80C, Tizen 7 / LG OLED55C3, webOS 23 / Chromecast with Google TV, Android 12"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: APL TV version
      description: APL TV › Settings › About
      placeholder: "1.0.4"
  - type: dropdown
    id: install
    attributes:
      label: How you installed APL TV
      options:
        - APL Launcher Setup
        - Apps2Samsung
        - Developer Mode, by hand
        - Homebrew Channel (LG)
        - The .apk (Android)
        - Other
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what you saw. A photo or a screenshot helps a lot.
    validations:
      required: true
