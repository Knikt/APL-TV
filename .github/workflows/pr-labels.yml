name: Pull request labels

# Labels a pull request by the TVs its files concern (.github/labeler.yml). Only the list of changed
# files is read: the pull request's code is never checked out nor run here.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
