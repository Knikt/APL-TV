name: Package

# Builds apl-tv-vX.Y.Z.wgt on every push to main; a v* tag also publishes it in a GitHub Release,
# with SHA256SUMS-wgt.txt. Signed with the Tizen SDK's default certificate: APL Launcher Setup
# (or Apps2Samsung) signs it again for each screen.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Only the release job writes: the package job runs the downloaded Tizen tools.
permissions:
  contents: read

jobs:
  wgt:
    name: APL TV .wgt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TIZEN_SDK: /home/runner/tizen-sdk
    steps:
      - uses: actions/checkout@v4

      # tools/check.py runs node --check on the scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tag matches app/config.xml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/.*<widget[^>]* version="\([^"]*\)".*/\1/p' app/config.xml)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but config.xml is $version" >&2; exit 1; }

      # Tizen-Core CLI (tz) from the official Tizen SDK package repository
      # (versions and SHA256 from its pkg_list_ubuntu-64).
      - name: Install Tizen-Core CLI
        run: |
          base=https://download.tizen.org/sdk/tizenstudio/official/binary
          mkdir -p "$TIZEN_SDK"
          while read -r file sha; do
            curl -fsSL -o "$RUNNER_TEMP/$file" "$base/$file"
            echo "$sha  $RUNNER_TEMP/$file" | sha256sum -c -
            unzip -q -o "$RUNNER_TEMP/$file" 'data/*' -d "$RUNNER_TEMP/pkg"
          done <<'LIST'
          tizen-core_10.0.18_ubuntu-64.zip 08b60e8f630fe0c3aafa5be9251a75d9ce173f2521375ddb803f9a3cb57f62ec
          web-privilege-checker_0.0.2_ubuntu-64.zip 5dce06d92b3f046303f3baabd1e8a4bb6cfb7724e051da5d83205fd6d88f7ccc
          certificate-generator_0.1.4_ubuntu-64.zip 446aa52f249205f4ad573173b02c9c38aa5de0316028b77dd189e44fd5f75964
          LIST
          cp -R "$RUNNER_TEMP/pkg/data/." "$TIZEN_SDK/"
          # tz finds the SDK by the sdk.info an SDK installer writes into its root.
          printf 'TIZEN_SDK_INSTALLED_PATH=%s\nTIZEN_SDK_DATA_PATH=%s\n' "$TIZEN_SDK" "$TIZEN_SDK-data" > "$TIZEN_SDK/sdk.info"
          mkdir -p "$TIZEN_SDK-data"
          chmod +x "$TIZEN_SDK"/tools/tizen-core/{tz,tgn,ninja,web-privilege-checker}
          "$TIZEN_SDK/tools/tizen-core/tz" --version

      - name: Build the package
        run: bash tools/make-package.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: APL-TV-wgt
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wgt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: APL-TV-wgt
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/apl-tv-v*.wgt
            dist/SHA256SUMS-wgt.txt
          generate_release_notes: true
